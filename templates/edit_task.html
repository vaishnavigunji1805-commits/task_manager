<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Edit Task</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        .navbar {
            background: #2c3e50;
            color: white;
            padding: 18px 30px;
        }

        .container {
            width: 500px;
            max-width: 90%;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 100px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .back {
            display: block;
            margin-top: 15px;
            text-decoration: none;
            color: #3498db;
        }

    </style>

</head>

<body>

<div class="navbar">

    <h1>📋 Personalized Task Manager</h1>

</div>

<div class="container">

    <h2>✏️ Edit Task</h2>

    <form method="POST">

        <label>Task Title</label>

        <input
            type="text"
            name="title"
            value="{{ task['title'] }}"
            required
        >

        <label>Description</label>

        <textarea name="description">{{ task['description'] or '' }}</textarea>

        <label>Category</label>

        <select name="category" required>

            <option value="Work"
                {% if task['category'] == 'Work' %}selected{% endif %}>
                Work
            </option>

            <option value="Study"
                {% if task['category'] == 'Study' %}selected{% endif %}>
                Study
            </option>

            <option value="Personal"
                {% if task['category'] == 'Personal' %}selected{% endif %}>
                Personal
            </option>

            <option value="Fitness"
                {% if task['category'] == 'Fitness' %}selected{% endif %}>
                Fitness
            </option>

        </select>

        <label>Priority</label>

        <select name="priority" required>

            <option value="High"
                {% if task['priority'] == 'High' %}selected{% endif %}>
                High
            </option>

            <option value="Medium"
                {% if task['priority'] == 'Medium' %}selected{% endif %}>
                Medium
            </option>

            <option value="Low"
                {% if task['priority'] == 'Low' %}selected{% endif %}>
                Low
            </option>

        </select>

        <label>Due Date</label>

        <input
            type="date"
            name="due_date"
            value="{{ task['due_date'] or '' }}"
        >

        <label>Status</label>

        <select name="status">

            <option value="Pending"
                {% if task['status'] == 'Pending' %}selected{% endif %}>
                Pending
            </option>

            <option value="In Progress"
                {% if task['status'] == 'In Progress' %}selected{% endif %}>
                In Progress
            </option>

            <option value="Completed"
                {% if task['status'] == 'Completed' %}selected{% endif %}>
                Completed
            </option>

        </select>

        <button type="submit">
            Save Changes
        </button>

    </form>

    <a href="/tasks" class="back">
        ← Back to Tasks
    </a>

</div>

</body>

</html>
