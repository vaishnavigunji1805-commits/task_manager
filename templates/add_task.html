<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Task</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        .navbar {
            background: #2c3e50;
            padding: 18px 30px;
            color: white;
        }

        .container {
            width: 500px;
            max-width: 90%;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #2980b9;
        }

        .back {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            color: #3498db;
        }
    </style>
</head>

<body>

<div class="navbar">
    <h1>Personalized Task Manager</h1>
</div>

<div class="container">

    <h2>➕ Add New Task</h2>

    <form method="POST">

        <label>Task Title</label>

        <input
            type="text"
            name="title"
            placeholder="Enter task title"
            required
        >

        <label>Description</label>

        <textarea
            name="description"
            placeholder="Enter task description"
        ></textarea>

        <label>Category</label>

        <select name="category" required>

            <option value="">Select Category</option>
            <option value="Work">Work</option>
            <option value="Study">Study</option>
            <option value="Personal">Personal</option>
            <option value="Fitness">Fitness</option>

        </select>

        <label>Priority</label>

        <select name="priority" required>

            <option value="">Select Priority</option>
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>

        </select>

        <label>Due Date</label>

        <input
            type="date"
            name="due_date"
        >

        <button type="submit">
            Add Task
        </button>

    </form>

    <a href="/" class="back">← Back to Dashboard</a>

</div>

</body>
</html>
